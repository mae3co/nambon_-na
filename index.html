<style>
/* Layout: one narrow column of sticker cards on a lilac gingham table. Single pastel look on purpose.
   blue = 진짜 나 / 내가 본 나, pink = 남이 본 나, mint = 둘 다 */
:root{
  --bg:#F2ECFF; --check:rgba(190,170,255,.28); --surface:#FFFFFF; --ink:#3B2A4A; --muted:#7A6A88; --soft:#E6DDF3;
  --butter:#FFE27A; --butter-deep:#FFD447;
  --self:#5B6CFF; --self-soft:#E4E7FF; --friend:#F2557A; --friend-soft:#FFE1E8; --both:#1F9E7B; --both-soft:#D5F4E8;
  --mirror:#FFB3C6; --glass:#DDF2FF; --blush:#FF8FA8;
  --display:"Jua","Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);
  background-image:linear-gradient(90deg,var(--check) 50%,transparent 50%),linear-gradient(var(--check) 50%,transparent 50%);
  background-size:30px 30px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));min-height:100vh}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:2.05rem} h2{font-size:1.5rem} h3{font-size:1.2rem}
p{margin:0}
b{font-weight:700}
.muted{color:var(--muted);font-size:.95rem}
.eyebrow{font-family:var(--display);font-size:.95rem;color:var(--muted)}
.pill{align-self:center;font-family:var(--display);font-size:.95rem;background:var(--surface);border:2px solid var(--ink);border-radius:99px;padding:3px 14px}
.panel{background:var(--surface);border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font-family:var(--display);font-size:1.1rem;min-height:54px;border-radius:16px;padding:10px 20px;border:2.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button.primary{background:var(--butter)}
button.primary:hover{background:var(--butter-deep)}
button:focus-visible,input:focus-visible{outline:3px solid var(--self);outline-offset:3px}
button.link{min-height:auto;border:0;box-shadow:none;background:none;padding:6px 2px;font-family:var(--body);font-size:.95rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
button.link:active{transform:none}
input[type=text]{font:inherit;font-size:1.1rem;width:100%;padding:14px 16px;border-radius:16px;border:2.5px solid var(--ink);background:#FBF9FF;color:var(--ink)}
input::placeholder{color:#B4A8C2}
label{font-size:.95rem;color:var(--muted)}
.big-cta{width:100%;min-height:62px;font-size:1.3rem}
.list button.big-cta{justify-content:center;text-align:center}
.badge{align-self:flex-start;font-family:var(--display);font-size:.9rem;color:var(--friend);background:var(--friend-soft);border-radius:99px;padding:2px 12px}
.err{color:var(--friend);font-size:.95rem}
.hero{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.hero h1 .s{color:var(--self)} .hero h1 .f{color:var(--friend)}
.hero .muted{max-width:30ch}

/* mascot: an original hand-mirror friend */
.mascot{display:block;margin:0 auto;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(59,42,74,.15))}
@keyframes bob{50%{transform:translateY(-7px) rotate(-2deg)}}
.bubble{position:relative;background:var(--surface);border:2.5px solid var(--ink);border-radius:18px;padding:8px 16px;font-family:var(--display);font-size:1.1rem;line-height:1.4}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:var(--surface);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.talk{display:flex;flex-direction:column;align-items:center;gap:14px}

/* home steps: a real sequence, so numbered */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:var(--surface);border:2.5px solid var(--ink);border-radius:18px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.step i{font-style:normal;font-family:var(--display);width:30px;height:30px;border-radius:50%;background:var(--butter);border:2px solid var(--ink);display:grid;place-items:center}
.step span{font-family:var(--display);font-size:.98rem;line-height:1.35}

/* friend intro */
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tag{font-family:var(--display);font-size:.95rem;background:var(--surface);border:2px solid var(--ink);border-radius:99px;padding:4px 12px}
.tag.hot{background:var(--friend-soft)}
.locked{position:relative;overflow:hidden}
.locked .blur{filter:blur(5px);opacity:.7;pointer-events:none;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.locked .blur span{width:64px;height:64px;border-radius:50%;background:var(--friend-soft);border:2px solid var(--ink)}
.locked .blur span.c{background:var(--self);width:80px;height:80px}
.locked .lock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.15rem}
.locked .lock em{font-style:normal;font-size:1rem;margin-inline:12px;text-align:center;background:var(--butter);border:2.5px solid var(--ink);border-radius:99px;padding:6px 16px}

/* 4. one-line nickname: me vs them */
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nmcard{border-radius:18px;border:2px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.nmcard.me{background:var(--self-soft)} .nmcard.them{background:var(--friend-soft)}
.nmcard .lab{font-size:.85rem;font-family:var(--display)}
.nmcard.me .lab{color:var(--self)} .nmcard.them .lab{color:var(--friend)}
.nmcard .nick{font-family:var(--display);font-size:1.35rem;line-height:1.3}
.nmcard .ty{font-family:var(--display);font-size:1.05rem;letter-spacing:.08em;color:var(--muted)}
.ty .diff{color:var(--friend)}

/* 2. the reversal scene */
.scene{display:flex;flex-direction:column;gap:12px}
.scene .said{font-size:1.08rem;line-height:1.6}
.scene .said b{color:var(--self)}
.scene .but{font-family:var(--display);font-size:1.4rem;line-height:1.45}
.scene .but b{color:var(--friend);font-weight:400}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter i{width:24px;height:24px;border-radius:50%;background:var(--soft);border:2px solid var(--ink)}
.meter i.on{background:var(--friend)}

/* 1. Johari windows */
.windows{display:flex;flex-direction:column;gap:10px}
.win{border-radius:18px;border:2px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:8px}
.win.both{background:var(--both-soft)} .win.mine{background:var(--self-soft)} .win.theirs{background:var(--friend-soft)}
.win .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.win h3{font-size:1.2rem}
.win.both h3{color:var(--both)} .win.mine h3{color:var(--self)} .win.theirs h3{color:var(--friend)}
.win .sub{font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.92rem;padding:5px 12px;border-radius:99px;background:var(--surface);border:2px solid var(--ink)}
.win .empty{font-size:.9rem;color:var(--muted)}

/* 3. friends split */
.split{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:2px dashed var(--soft)}
.split .t{font-weight:700}
.side2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side2 div{border:2px solid var(--ink);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0;font-size:.9rem}
.side2 b{font-family:var(--display);font-weight:400;color:var(--friend)}

/* orbit */
.orbit{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto}
.orbit svg{position:absolute;inset:0;width:100%;height:100%}
.orbit svg line{stroke:var(--ink);stroke-width:.35;opacity:.35}
.orbit svg circle{fill:none;stroke:var(--ink);stroke-width:.35;stroke-dasharray:1 1.4;opacity:.5}
.orbit svg text{fill:var(--muted);font-size:3.2px;font-family:var(--display)}
.center,.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:50%;border:2.5px solid var(--ink)}
.center{left:50%;top:50%;width:27%;aspect-ratio:1;background:var(--self);color:#fff;gap:2px}
.center .nm{font-size:.78rem;font-family:var(--display);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center .ty{font-family:var(--display);font-size:clamp(1.15rem,5vw,1.7rem);letter-spacing:.05em;line-height:1}
.center .cap{font-size:.66rem;opacity:.9}
.node{width:20%;aspect-ratio:1;background:var(--friend-soft)}
.node .nm{font-size:.72rem;font-family:var(--display);color:var(--friend);max-width:88%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ty{font-family:var(--display);font-size:clamp(.9rem,3.8vw,1.2rem);letter-spacing:.04em;line-height:1.1}
.says{display:flex;flex-direction:column}
.say{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-top:2px dashed var(--soft)}
.say:first-child{border-top:0}
.say .who{min-width:0} .say .who b{font-family:var(--display);font-weight:400;color:var(--friend)}
.say .tc{font-family:var(--display);font-size:1.35rem;letter-spacing:.04em;white-space:nowrap}
.say .tc .diff{color:var(--friend)}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.progress{flex:1;height:14px;border-radius:99px;background:var(--soft);border:2px solid var(--ink);overflow:hidden}
.progress i{display:block;height:100%;background:var(--friend);transition:width .25s}
.count{font-family:var(--display);font-size:1rem;white-space:nowrap}
.ask{font-family:var(--display);font-size:1.05rem}
.ask.self{color:var(--self)} .ask.friend{color:var(--friend)}
.q{font-family:var(--display);font-size:1.5rem;line-height:1.45}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{text-align:left;padding:16px;font-family:var(--body);font-size:1.05rem;line-height:1.5;display:flex;gap:12px;align-items:center;min-height:68px}
.choice .ab{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);background:var(--self-soft)}
.choice:nth-child(2) .ab{background:var(--friend-soft)}
.choice:hover{background:#FBF9FF}

/* reveal */
.reveal{text-align:center;align-items:center}
.reveal .big{font-family:var(--display);font-size:3.6rem;letter-spacing:.08em;line-height:1;color:var(--self)}
.reveal .big span{display:inline-block;animation:pop .5s both}
.reveal .big span:nth-child(2){animation-delay:.25s}.reveal .big span:nth-child(3){animation-delay:.5s}.reveal .big span:nth-child(4){animation-delay:.75s}
.reveal .big span.miss{color:var(--friend)}
@keyframes pop{from{transform:translateY(14px) scale(.5);opacity:.2}to{transform:none;opacity:1}}
.score{font-family:var(--display);font-size:1.4rem}
.rank{align-items:center;text-align:center;background:var(--butter)}
.rank-big{font-family:var(--display);font-size:2rem;line-height:1.3}
.rank button{width:100%;background:var(--surface)}
b.f{color:var(--friend)} b.s{color:var(--self)}

.codebox{font-family:var(--mono);font-size:.85rem;background:#FBF9FF;border:2px dashed var(--ink);border-radius:14px;padding:12px;word-break:break-all;user-select:all}
.list{display:flex;flex-direction:column;gap:10px}
.list button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-family:var(--display)}
.loading{align-items:center;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
/* s: situation, a: choices, t: short trait for each choice (used in result sentences), x: axis */
const QS=[
 {s:'금요일 저녁, 약속이 갑자기 취소됐다.',a:['바로 다른 친구한테 연락해서 다시 약속을 잡는다','오히려 좋아. 집에서 혼자 쉰다'],t:['약속 깨지면 바로 딴 약속 잡음','약속 깨지면 집에서 쉼'],x:0},
 {s:'처음 가는 모임에 혼자 도착했다.',a:['옆 사람한테 먼저 말을 건다','누가 말 걸어줄 때까지 폰 보며 기다린다'],t:['처음 보는 사람한테 먼저 말 검','누가 말 걸 때까지 기다림'],x:0},
 {s:'주말 내내 사람들 만나고 온 일요일 밤.',a:['"재밌었다, 또 놀자" 하고 단톡에 남긴다','방전돼서 연락을 잠깐 안 받는다'],t:['사람 만나면 충전됨','사람 만나면 방전됨'],x:0},
 {s:'여행 계획을 세우는 중이다.',a:['맛집, 동선, 가격부터 검색한다','"거기 가면 분위기 좋겠다" 상상부터 한다'],t:['여행 가면 맛집·동선부터 찾음','여행 가면 분위기부터 상상함'],x:1},
 {s:'영화 보고 나와서 얘기하는 중이다.',a:['"그 장면 연기 미쳤다" 하고 장면 얘기를 한다','"근데 결말이 무슨 뜻일까" 하고 해석 얘기를 한다'],t:['영화 보면 장면 얘기','영화 보면 해석 얘기'],x:1},
 {s:'누가 길을 물어봤다.',a:['"편의점 지나서 두 번째 골목 오른쪽"처럼 알려준다','"큰 건물 보이는 쪽으로 쭉 가면 돼"처럼 알려준다'],t:['길도 정확하게 알려줌','길도 감으로 알려줌'],x:1},
 {s:'친구가 "나 면접 망쳤어"라고 한다.',a:['뭐가 문제였는지 같이 따져본다','"많이 속상하지" 하고 먼저 위로한다'],t:['위로보다 해결책이 먼저','해결책보다 위로가 먼저'],x:2},
 {s:'하기 싫은 부탁을 받았다.',a:['안 되는 이유를 말하고 깔끔하게 거절한다','상대 기분 상할까 봐 고민하다 결국 들어준다'],t:['싫은 부탁은 딱 거절','싫은 부탁도 결국 들어줌'],x:2},
 {s:'단톡방에서 의견이 둘로 갈렸다.',a:['맞다고 생각하는 쪽을 근거 대고 말한다','분위기 안 깨지게 중간에서 정리한다'],t:['단톡에서 할 말은 함','단톡에서 분위기 중재함'],x:2},
 {s:'다음 주에 여행을 간다. 짐은?',a:['며칠 전에 체크리스트 보며 싼다','출발 전날 밤에 몰아서 싼다'],t:['짐은 며칠 전에 미리 쌈','짐은 전날 밤에 몰아서 쌈'],x:3},
 {s:'주말 계획이 당일 아침에 바뀌었다.',a:['좀 불편하다. 원래 계획대로가 좋다','오히려 재밌다. 그때그때 하면 된다'],t:['계획 바뀌면 불편함','계획 바뀌면 오히려 신남'],x:3},
 {s:'다 같이 밥 먹기로 했다.',a:['식당을 미리 찾아서 예약까지 해둔다','"만나서 정하자" 하고 일단 나간다'],t:['밥 약속엔 예약까지 해둠','밥 약속은 만나서 정함'],x:3}
];
const AX=[['E','I'],['S','N'],['T','F'],['J','P']];
const N=QS.length;
const MAXNODE=8;

/* demo: 지민 (real INFJ) and five friends — example data only */
const DEMO={id:'demo00',name:'지민',real:'INFJ',self:'bbbbbbbbbaaa',res:[
  ['민수','aabbbbabbbbb'],['하은','abbbbbbbbbba'],['준호','aaaababababbb'.slice(0,12)],['서연','bbbbbbbbbabb'],['도윤','aabbbbbbbbbb']
].map(([nick,a])=>({nick,a}))};
const DEMO_FRIEND={nick:'서연',a:'bbbbbbbbbabb'};

/* ---------- Supabase (publishable key is meant to be public; rules live in RLS) ---------- */
const SB_URL='https://rtodeywewcaxjfartdyc.supabase.co';
const SB_KEY='sb_publishable_FLkC4qumtHIdevd-jAHhQg_wbFcWeMF';
let sb=null;
try{if(window.supabase&&window.supabase.createClient)sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}})}catch(e){sb=null}
const fromRow=m=>({id:m.id,name:m.name,real:m.real_type||'',self:m.self_answers,res:[]});
async function getMirror(id){
  const {data,error}=await sb.from('mirrors').select('id,name,real_type,self_answers').eq('id',id).maybeSingle();
  if(error)throw error;return data?fromRow(data):null;
}
async function countResponses(id){
  const {count,error}=await sb.from('responses').select('*',{count:'exact',head:true}).eq('mirror_id',id);
  return error?0:(count||0);
}
async function getResponses(id){
  const {data,error}=await sb.from('responses').select('nickname,answers,created_at').eq('mirror_id',id).order('created_at');
  if(error)throw error;return data.map(r=>({nick:r.nickname,a:r.answers}));
}
async function createMirror(name,real,self){

const LS='mirror.v3';
function mem(){try{const m=JSON.parse(localStorage.getItem(LS));return m&&m.mine?m:{mine:{},answered:{}}}catch(e){return{mine:{},answered:{}}}}
function remember(fn){const m=mem();fn(m);try{localStorage.setItem(LS,JSON.stringify(m))}catch(e){}}

/* ---------- scoring ---------- */
function axisShare(list){return AX.map((_,x)=>{let a=0,t=0;list.forEach(s=>QS.forEach((q,i)=>{if(q.x===x){t++;if(s[i]==='a')a++}}));return t?a/t:.5})}
const typeOf=sh=>sh.map((v,x)=>v>.5?AX[x][0]:v<.5?AX[x][1]:'X').join('');
const baseType=t=>t.real||typeOf(axisShare([t.self]));
function closeness(t,a){
  if(t.real){const sh=axisShare([a]);return sh.reduce((s,v,x)=>s+(t.real[x]===AX[x][0]?v:1-v),0)/4}
  return [...a].filter((c,i)=>c===t.self[i]).length/N;
}
/* 4. two-word nickname from a type */
const ADJ={TJ:'빈틈없는',TP:'쿨한',FJ:'다정한',FP:'자유로운'};
const NOUN={ES:'분위기 메이커',EN:'아이디어 뱅크',IS:'든든한 현실파',IN:'몽상가'};
const nickname=ty=>(ADJ[ty[2]+ty[3]]||'알쏭달쏭한')+' '+(NOUN[ty[0]+ty[1]]||'반전 매력러');
/* per question: what most friends said and how strongly */
function perQuestion(t){
  const n=t.res.length;
  return QS.map((q,i)=>{
    const aWho=t.res.filter(r=>r.a[i]==='a').map(r=>r.nick),bWho=t.res.filter(r=>r.a[i]==='b').map(r=>r.nick);
    const maj=aWho.length>=bWho.length?'a':'b';const share=Math.max(aWho.length,bWho.length)/n;
    const kind=share<=.6?'split':(maj===t.self[i]?'both':'blind');
    return{i,q,maj,share,kind,aWho,bWho,mine:t.self[i]};
  });
}

/* Korean particle: J('지민','은','는') -> '지민은'; P(word,'이래','래') -> just the particle */
const J=(w,a,b)=>{const c=w.charCodeAt(w.length-1);const has=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0;return w+(has?a:b)};
const P=(w,a,b)=>J(w,a,b).slice(w.length);

function orbitHTML(t){
  const res=t.res.slice(-MAXNODE);const k=res.length;const bt=baseType(t);
  const rMin=Math.min(30,Math.max(23,10.5/Math.sin(Math.PI/Math.max(k,2)))),rMax=40;
  const pos=res.map((r,i)=>{const a=-Math.PI/2+i*2*Math.PI/Math.max(k,1);const rad=rMin+(1-closeness(t,r.a))*(rMax-rMin);return[50+rad*Math.cos(a),50+rad*Math.sin(a)]});
  return `<div class="orbit" role="img" aria-label="${esc(J(t.name,'을','를'))} 가운데 두고, 비슷하게 본 친구일수록 가깝게 놓은 그림">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${rMin}"/><circle cx="50" cy="50" r="${rMax}"/>
      <text x="50" y="${50-rMin-1}" text-anchor="middle">찰떡</text><text x="50" y="${50-rMax-1}" text-anchor="middle">글쎄</text>
      ${pos.map(([x,y])=>`<line x1="50" y1="50" x2="${x}" y2="${y}"/>`).join('')}</svg>
    ${res.map((r,i)=>`<div class="node" style="left:${pos[i][0]}%;top:${pos[i][1]}%"><span class="nm">${esc(r.nick)}</span><span class="ty">${diffLetters(typeOf(axisShare([r.a])),bt)}</span></div>`).join('')}
    <div class="center"><span class="nm">${esc(t.name)}</span><span class="ty">${bt}</span><span class="cap">${t.real?'진짜 나':'내가 본 나'}</span></div></div>
    ${t.res.length>MAXNODE?`<p class="muted">둘레에는 최근 ${MAXNODE}명만 보여. 전체는 아래 목록에 있어.</p>`:''}
    <div class="says">${t.res.map(r=>({r,c:closeness(t,r.a)})).sort((a,b)=>b.c-a.c).map(({r,c})=>`<div class="say"><span class="who"><b>${esc(r.nick)}</b>의 평가<br><span class="muted">닮은 정도 ${Math.round(c*100)}%</span></span><span class="tc">${diffLetters(typeOf(axisShare([r.a])),bt)}</span></div>`).join('')}</div>`;
}

      else friendAnswer(p,{nick,ans,err:'저장이 안 됐어. 인터넷 확인하고 다시 눌러줘. 답은 그대로 있어.'});
    }};
  document.getElementById('f').onsubmit=e=>{e.preventDefault();const nick=document.getElementById('nk').value.trim();
    if(!nick){const er=document.getElementById('er');er.textContent='별명을 하나 정해줘.';er.hidden=false;return}
    if(keep&&keep.ans){submit(nick,keep.ans);return}
    quiz({mode:'friend',name:p.name,done:ans=>submit(nick,ans)})};
}

/* friend's ending: their view first, then the reveal of the real type */
function friendDone(p,ans,nick,isDemo){
  const fty=typeOf(axisShare([ans]));
  app.innerHTML=`${isDemo?'<span class="badge">예시 · 서연이 지민 테스트를 끝낸 화면</span>':''}
    <section class="panel"><span class="eyebrow">${esc(J(nick,'이','가'))} 본 ${esc(p.name)}</span>
      <p class="muted">네 눈에 ${esc(J(p.name,'은','는'))}</p>
      <h2>${nickname(fty)}</h2><p class="score">${fty}</p>
      <button class="primary" id="rv">진짜 ${esc(p.name)} 공개하기</button></section>
    <div id="out"></div>`;
  go('rv',()=>{
    const bt=p.real||typeOf(axisShare([p.self]));
    const hit=[...fty].filter((c,i)=>c===bt[i]).length;
    const same=[...ans].filter((c,i)=>c===p.self[i]).length;
    const c=Math.round(closeness(p,ans)*100);
    const verdict=c>=85?'찰떡이야. 너 '+p.name+' 진짜 잘 안다':c>=60?'꽤 잘 알아. 몇 개만 갈렸어':c>=35?'반은 통했어. 나머지는 '+J(p.name,'도','도')+' 모르는 모습일지도?':'반전 발견! '+J(p.name,'도','도')+' 모르는 '+J(p.name,'을','를')+' 네가 찾았을지도?';
    /* rank among everyone who answered (ties share a place) */
    const all=(p.res&&p.res.length?p.res:[{nick,a:ans}]).map(r=>({nick:r.nick,c:closeness(p,r.a)}));
    if(!all.some(r=>r.nick===nick))all.push({nick,c:closeness(p,ans)});
    const mine=closeness(p,ans);const total=all.length;
    const rank=1+all.filter(r=>r.c>mine+1e-9).length;
    const top=all.filter(r=>r.nick!==nick).sort((a,b)=>b.c-a.c)[0];
    const rankLine=total===1?'첫 번째로 답했어! 지금은 네가 1등':rank===1?`${total}명 중 1등!${top&&Math.abs(top.c-mine)<1e-9?' (공동)':''}`:`${total}명 중 ${rank}등!`;
    const rankSub=total===1?'친구들이 답하면 순위가 바뀔 수 있어.':rank===1?(top?`2등 ${esc(J(top.nick,'이랑','랑'))} ${Math.round((mine-top.c)*100)}% 차이`:''):`1등 ${esc(top.nick)}까지 ${Math.round((top.c-mine)*100)}% 남았어`;
    const mi=[...ans].findIndex((ch,k)=>ch!==p.self[k]);
    document.getElementById('rv').hidden=true;
    document.getElementById('out').innerHTML=`<div class="list" style="gap:20px">
      <section class="panel reveal">${mascot(c>=60?'happy':'wow',90)}<span class="eyebrow">${p.real?'진짜 '+esc(p.name):esc(J(p.name,'이','가'))+' 직접 답한 결과'}</span>
        <div class="big">${[...bt].map((ch,i)=>`<span class="${ch!==fty[i]?'miss':''}">${ch}</span>`).join('')}</div>
        <h2>${nickname(bt)}</h2>
        <p class="score">4글자 중 ${hit}개 · 닮은 정도 ${c}%</p><p>${esc(verdict)}</p></section>
      <section class="panel rank"><span class="eyebrow">누가 ${esc(J(p.name,'을','를'))} 제일 잘 알까</span>
        <p class="rank-big">${rankLine}</p>${rankSub?`<p class="muted">${rankSub}</p>`:''}
        ${isDemo?'':`<button class="primary" data-share2>친구한테도 보내서 대결하기</button>`}</section>
      ${mi>=0?`<section class="panel"><span class="eyebrow">네가 찾은 반전</span>
        <p>너는 <b class="f">"${esc(QS[mi].t[ix(ans[mi])])}"</b>일 것 같다고 했는데,<br>${esc(J(p.name,'은','는'))} 스스로 <b class="s">"${esc(QS[mi].t[ix(p.self[mi])])}"</b>${P(QS[mi].t[ix(p.self[mi])],'이래','래')}.</p>
        <p class="muted">누구 말이 맞을까? ${esc(J(p.name,'이','가'))} 모르는 모습일 수도 있어.</p>
        <p class="muted">${N}개 장면 중 ${same}개 같았어.</p></section>`:''}
      <div class="row">${isDemo?'':'<button class="primary" id="all">다른 친구들 평가 보기</button>'}<button id="mine">나도 내 거울 만들기</button></div></div>`;
    go('all',()=>nav(p.id));go('mine',createName);
    app.querySelectorAll('[data-share2]').forEach(b=>b.onclick=async()=>{
      const url=linkFor(p.id),text=`나 ${J(p.name,'을','를')} ${total}명 중 ${rank}등으로 잘 알아. 너는 몇 등일까?`;
      if(navigator.share){navigator.share({title:'남이 본 나',text,url}).catch(()=>{});return}
      try{await navigator.clipboard.writeText(text+' '+url);toast('링크 복사했어')}catch(e){toast(url)}});
  });
}

/* results: public, but a friend sees them only after answering */
function resultView(t,{demo=false,owner=false}={}){
  const n=t.res.length;
  if(!n){app.innerHTML=`<header class="hero"><span class="eyebrow">${esc(t.name)}의 거울</span><h2>아직 친구 답이 없어</h2>
      <p class="muted">링크를 보내고 기다려봐. 답이 들어오면 여기에 바로 보여.</p></header>
    <section class="panel"><h2>친구한테 보낼 링크</h2>${shareBlock(t.id,t.name)}</section>
    <div class="row"><button id="rf">새로고침</button><button class="link" id="h">처음으로</button></div>`;
    wireShare(t.id,t.name);go('rf',start);go('h',()=>nav(null));return}
  const pq=perQuestion(t);const fty=typeOf(axisShare(t.res.map(r=>r.a)));
  app.innerHTML=`<header class="hero">${demo?'<span class="badge">예시 데이터</span>':''}<span class="eyebrow">${esc(t.name)}의 거울 · 친구 ${n}명</span></header>
    <section class="panel">${namesHTML(t,fty)}</section>
    <section class="panel">${sceneHTML(t,pq)}</section>
    <section class="panel"><h2>들킨 나, 숨은 나</h2>${windowsHTML(t,pq)}</section>
    <section class="panel"><h2>친구끼리도 갈렸어</h2>${splitHTML(pq)}</section>
    <section class="panel"><h2>누가 ${esc(J(t.name,'을','를'))} 제일 잘 알까</h2><p class="muted">가까울수록 비슷하게 본 친구야.</p>${orbitHTML(t)}</section>
    ${demo?`<section class="panel"><h2>친구 쪽에선 이렇게 보여</h2><p class="muted">친구가 답을 다 하면 마지막에 진짜 ${esc(J(t.name,'이','가'))} 공개돼.</p><div class="row"><button id="demof">친구 화면 예시</button></div></section>`
      :owner?`<section class="panel"><h2>친구 더 부르기</h2>${shareBlock(t.id,t.name)}</section>`
      :`<section class="panel"><h2>나도 해볼래?</h2><p class="muted">친구들이 보는 나는 어떨까.</p><div class="row"><button class="primary" id="mine">내 거울 만들기</button></div></section>`}
    <div class="row">${demo?'':'<button id="rf">새로고침</button>'}<button class="link" id="h">처음으로</button></div>`;
  go('h',()=>nav(null));go('rf',start);go('mine',createName);
  go('demof',()=>friendDone(DEMO,DEMO_FRIEND.a,DEMO_FRIEND.nick,true));
  if(owner)wireShare(t.id,t.name);
}

async function open(id){
  if(!sb){errorView('지금 서버에 연결이 안 돼. 잠시 후 다시 시도해줘.');return}
  loading('거울 불러오는 중…');
  try{
    const t=await getMirror(id);
    if(!t){app.innerHTML=`<section class="panel"><h2>없는 거울이야</h2><p class="muted">링크가 잘렸는지 확인해줘.</p><div class="row"><button class="primary" id="h">처음으로</button></div></section>`;go('h',()=>nav(null));return}
    const m=mem();const owner=!!m.mine[id];
    if(!owner&&!m.answered[id]){t.count=await countResponses(id);friendAnswer(t);return}
    t.res=await getResponses(id);
    resultView(t,{owner});
  }catch(err){errorView(errText(err))}
}

function nav(id){try{history.pushState(null,'',id?'?m='+id:location.pathname)}catch(e){}id?open(id):home()}
function start(){const id=new URLSearchParams(location.search).get('m');id&&/^[0-9a-f]{8}$/.test(id)?open(id):home()}
window.addEventListener('popstate',start);
start();
</script>
